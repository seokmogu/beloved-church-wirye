name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  # All branches share one development database. Queue, rather than cancel, so
  # tests which create or update CMS records cannot overlap across pull requests.
  group: beloved-church-wirye-dev-db
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Lint
        run: pnpm lint

      - name: Integration tests (dev DB)
        env:
          POSTGRES_URL: ${{ secrets.DEV_POSTGRES_URL }}
          PAYLOAD_SECRET: ${{ secrets.DEV_PAYLOAD_SECRET }}
          MANAGE_AUTH_PROVIDER: ${{ secrets.DEV_MANAGE_AUTH_PROVIDER }}
          NEON_AUTH_BASE_URL: ${{ secrets.DEV_NEON_AUTH_BASE_URL }}
          NEON_AUTH_COOKIE_SECRET: ${{ secrets.DEV_NEON_AUTH_COOKIE_SECRET }}
          MANAGE_ADMIN_EMAILS: ${{ secrets.DEV_MANAGE_ADMIN_EMAILS }}
        run: pnpm test:int
